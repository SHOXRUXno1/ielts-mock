services:
  nginx:
    build:
      context: ./deploy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ielts-mock.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_STT_MODEL=${GEMINI_STT_MODEL:-gemini-3.5-flash}
      - GOOGLE_STT_CREDENTIALS_JSON=${GOOGLE_STT_CREDENTIALS_JSON:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - GOOGLE_STT_LOCATION=${GOOGLE_STT_LOCATION:-us}
      - GOOGLE_STT_MODEL=${GOOGLE_STT_MODEL:-chirp_3}
      - STT_GOOGLE_ONLY=${STT_GOOGLE_ONLY:-true}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-onwK4e9ZLuTAKqWW03F9}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_turbo_v2}
      - SIMLI_API_KEY=${SIMLI_API_KEY}
      - SIMLI_FACE_ID=${SIMLI_FACE_ID}
      - SIMLI_MAX_CONCURRENT=${SIMLI_MAX_CONCURRENT:-10}
      - SIMLI_SLOT_IDLE_MINUTES=${SIMLI_SLOT_IDLE_MINUTES:-5}
      - SIMLI_LEASE_MINUTES=${SIMLI_LEASE_MINUTES:-3}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-ielts-mock}
      - CORS_ORIGINS=["https://${APP_DOMAIN}"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://${APP_DOMAIN}
    expose:
      - "80"

