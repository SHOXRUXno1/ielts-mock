server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets with long cache. `always` applies the header on every
    # status code (nginx skips add_header on 40x/50x by default, which was
    # letting stale 404s slip past the immutable rule after a deploy).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback — never cache index.html.
    #
    # After a deploy the chunk file names change (Vite hashes them), so the
    # last-good index.html a browser cached would reference JS files that no
    # longer exist and the app crashes with "React error #130 (element type
    # invalid)" during lazy load. `no-store` tells the browser to refetch the
    # HTML every time; `always` makes sure the header is sent even on
    # non-2xx replies from try_files.
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
