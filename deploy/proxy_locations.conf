# Shared API / SPA routing. Included from HTTP :8080 and HTTPS :443.

location ~ ^/(admin|auth|student|tests|attempts|results|sections)(/|$) {
    if ($spa_from_browser) {
        return 418;
    }

    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Listening MP3s are 5–15 MB; default 60s body/send timeouts abort the POST.
    client_body_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
}

location /media/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 7d;
    add_header Cache-Control "public";
}

location = /health {
    proxy_pass http://api_backend;
    access_log off;
}

location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location @spa {
    # Same URL is an API route for XHR. If this HTML is cached (ETag, no
    # Cache-Control), Chrome reuses it for GET /student/tests and the SPA crashes.
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    add_header Cache-Control "no-store" always;
    add_header Vary "Accept" always;
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
