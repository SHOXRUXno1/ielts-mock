# Production nginx: HTTP :8080, ACME :80, HTTPS :443.

upstream api_backend {
    server backend:8000;
    keepalive 16;
}

map $http_accept $spa_from_browser {
    default 0;
    ~*text/html 1;
}

server {
    listen 80;
    server_name mock.shox-software.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mock.shox-software.uz$request_uri;
    }
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;
    error_page 418 = @spa;
    include /etc/nginx/proxy_locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mock.shox-software.uz;

    ssl_certificate /etc/letsencrypt/live/mock.shox-software.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mock.shox-software.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    error_page 418 = @spa;
    include /etc/nginx/proxy_locations.inc;
}
