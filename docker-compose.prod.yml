services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ielts_mock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: 4fan/ielts-mock-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
    entrypoint: ["sh", "/app/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: 4fan/ielts-mock-frontend:latest
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: 4fan/ielts-mock-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./deploy/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_locations.conf:/etc/nginx/proxy_locations.inc:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  media_data:
