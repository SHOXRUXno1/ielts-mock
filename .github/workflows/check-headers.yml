name: Check prod cache headers

on:
  push:
    paths:
      - .github/workflows/check-headers.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: probe backend /health
        run: |
          echo "=== GET /health ==="
          curl -s https://mock.shox-software.uz/health
          echo ""
      - name: find the speaking-examiner chunk in the index bundle
        run: |
          asset=$(curl -s https://mock.shox-software.uz/ | grep -oE 'assets/index-[^"]+\.js' | head -1)
          echo "Index asset: $asset"
          index_body=$(curl -s "https://mock.shox-software.uz/$asset")
          echo "Index bundle bytes: $(echo -n "$index_body" | wc -c)"
          echo ""
          echo "=== looking for lazy chunk name inside index bundle ==="
          # Vite's dynamic import puts filenames as string literals like
          # "speaking-examiner-session-XXXX.js" in the index chunk
          chunk=$(echo "$index_body" | grep -oE 'speaking-examiner-session-[A-Za-z0-9_-]+\.js' | head -1)
          echo "Speaking chunk file: $chunk"
          if [ -n "$chunk" ]; then
            body=$(curl -s "https://mock.shox-software.uz/assets/$chunk")
            bytes=$(echo -n "$body" | wc -c)
            echo "Chunk size: $bytes bytes"
            echo ""
            echo "sendCompleteRef mentions: $(echo "$body" | grep -c 'sendCompleteRef')"
            echo "speakingDoneRef mentions: $(echo "$body" | grep -c 'speakingDoneRef')"
            echo "repeat-phrase mentions:   $(echo "$body" | grep -c 'repeat-phrase')"
            echo ""
            echo "=== PR #27 marker (audioSentRef.current && !sendCompleteRef) ==="
            echo "$body" | grep -oE '[a-z]+Ref\.current&&![a-z]+Ref\.current' | sort | uniq -c
          fi
