name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: 4fan/ielts-mock-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: 4fan/ielts-mock-frontend:latest
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-nginx:
    name: Build nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./deploy
          file: ./deploy/Dockerfile
          push: true
          tags: 4fan/ielts-mock-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  deploy:
    name: Deploy
    needs: [build-backend, build-frontend, build-nginx]
    runs-on: ubuntu-latest
    steps:
      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          GOOGLE_STT_CREDENTIALS_B64: ${{ secrets.GOOGLE_STT_CREDENTIALS_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GOOGLE_STT_CREDENTIALS_B64
          script: |
            set -e
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd /opt/ielts-mock
            if [ -n "$GOOGLE_STT_CREDENTIALS_B64" ]; then
              python3 -c 'import base64,json,os,pathlib; raw=base64.b64decode(os.environ["GOOGLE_STT_CREDENTIALS_B64"]); blob=json.dumps(json.loads(raw),separators=(",",":")); p=pathlib.Path("/opt/ielts-mock/.env"); lines=[ln for ln in p.read_text().splitlines() if not ln.startswith("GOOGLE_STT_CREDENTIALS_JSON=")] if p.exists() else []; lines.append("GOOGLE_STT_CREDENTIALS_JSON="+blob); p.write_text("\n".join(lines)+"\n")'
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
