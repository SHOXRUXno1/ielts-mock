name: Diagnose production stack

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Read-only inspection
    runs-on: ubuntu-latest
    steps:
      - name: Inspect storage and provider config
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ielts-mock

            echo "===== SERVER SPEC ====="
            nproc | sed 's/^/vCPU: /'
            free -h | awk 'NR==2{print "RAM: "$2" total, "$3" used"}'
            df -h / | awk 'NR==2{print "Disk: "$2" total, "$3" used, "$5" full"}'

            echo
            echo "===== PROVIDER KEYS (set or not, no values) ====="
            for v in S3_ENDPOINT_URL S3_ACCESS_KEY S3_SECRET_KEY S3_BUCKET_NAME \
                     GEMINI_API_KEYS GROQ_API_KEY ELEVENLABS_API_KEY SIMLI_API_KEY; do
              line=$(grep -E "^${v}=" .env 2>/dev/null | head -1 | cut -d= -f2-)
              if [ -z "$line" ]; then
                echo "$v = (EMPTY / not set)"
              else
                echo "$v = SET (${#line} chars)"
              fi
            done

            echo
            echo "===== S3 ENDPOINT HOST (not a secret) ====="
            grep -E "^S3_ENDPOINT_URL=" .env 2>/dev/null | cut -d= -f2- | sed 's/^/endpoint: /' || echo "endpoint: (none)"
            grep -E "^S3_BUCKET_NAME=" .env 2>/dev/null | cut -d= -f2- | sed 's/^/bucket: /' || echo "bucket: (none)"

            echo
            echo "===== GEMINI KEY COUNT ====="
            grep -E "^GEMINI_API_KEYS=" .env 2>/dev/null | cut -d= -f2- | tr ',' '\n' | grep -c . | sed 's/^/keys: /' || echo "keys: 0"

            echo
            echo "===== WHERE AUDIO ACTUALLY LIVES ====="
            DB=$(docker compose -f docker-compose.prod.yml ps --format '{{.Name}}' | grep -iE 'postgres|db' | head -1)
            echo "db container: ${DB:-NOT FOUND}"
            if [ -n "$DB" ]; then
              docker exec "$DB" psql -U postgres -d ielts_mock -t -c \
                "select case when audio_url like '/media/%' then 'LOCAL DISK' else 'REMOTE (' || split_part(audio_url,'/',3) || ')' end as location, count(*) from sections where audio_url is not null and audio_url <> '' group by 1;" \
                2>&1 | sed 's/^/  sections: /'
            fi

            echo
            echo "===== MEDIA DIR SIZE ON DISK ====="
            BE=$(docker compose -f docker-compose.prod.yml ps --format '{{.Name}}' | grep -i backend | head -1)
            echo "backend container: ${BE:-NOT FOUND}"
            if [ -n "$BE" ]; then
              docker exec "$BE" du -sh /app/media 2>/dev/null | sed 's/^/  total: /'
              docker exec "$BE" du -sh /app/media/audio /app/media/images 2>/dev/null | sed 's/^/  /'
              docker exec "$BE" sh -c 'ls /app/media/audio | wc -l' 2>/dev/null | sed 's/^/  audio files: /'
            fi

            echo
            echo "===== RUNNING CONTAINERS ====="
            docker compose -f docker-compose.prod.yml ps --format '{{.Name}}\t{{.Service}}\t{{.Status}}'
