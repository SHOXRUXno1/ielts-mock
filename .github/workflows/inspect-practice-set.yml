name: Inspect practice set number

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read the anonymous student-facing number
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/ielts-mock
            docker compose -f docker-compose.prod.yml exec -T backend python - <<'PY'
            import asyncio
            from sqlalchemy import select

            from app.core.database import async_session
            from app.models.test import Test


            async def main() -> None:
                async with async_session() as db:
                    rows = (
                        await db.execute(
                            select(Test.book_slug, Test.test_number)
                            .where(Test.is_published.is_(True))
                            .order_by(Test.created_at.asc())
                        )
                    ).all()
                    for index, row in enumerate(rows, start=1):
                        if row.book_slug == "practice-set-e" and row.test_number == 1:
                            print(f"IELTS Practice Set E — Test 1 = Practice set #{index}")
                            return
                raise SystemExit("Practice Set E Test 1 is not published")


            asyncio.run(main())
            PY
