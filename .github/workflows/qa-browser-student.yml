name: QA Browser Student

# Creates a clearly labelled, isolated student for a browser acceptance test.
# It is deliberately manual: nothing in deploys or ordinary test runs can
# create student accounts in production.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Provision before QA, or deactivate after QA
        required: true
        type: choice
        options:
          - provision
          - deactivate
      login:
        description: Unique QA login, e.g. qa-browser-20260923
        required: true

concurrency:
  group: qa-browser-student
  cancel-in-progress: false

jobs:
  update-qa-student:
    name: ${{ inputs.action }} QA student
    runs-on: ubuntu-latest
    steps:
      - name: Update the isolated QA student on production
        uses: appleboy/ssh-action@v1.2.2
        env:
          QA_ACTION: ${{ inputs.action }}
          QA_LOGIN: ${{ inputs.login }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: QA_ACTION,QA_LOGIN
          script: |
            set -e
            cd /opt/ielts-mock
            docker compose -f docker-compose.prod.yml exec -T backend \
              python scripts/qa_browser_student.py "$QA_ACTION" "$QA_LOGIN"
