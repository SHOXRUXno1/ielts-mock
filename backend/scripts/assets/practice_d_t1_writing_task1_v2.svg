<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="595" viewBox="0 0 1500 595" role="img" aria-labelledby="title description">
  <title id="title">Growth of global freight by 2050 and projected carbon emissions</title>
  <desc id="description">Table comparing air, road, rail and sea freight volume and carbon dioxide emissions in 2010 and 2050, with percentage growth.</desc>
  <rect width="1500" height="595" fill="#fff"/>
  <style>
    .heading { font: 32px Arial, sans-serif; fill: #111; }
    .group { font: 29px Arial, sans-serif; fill: #111; }
    .unit { font: 25px Arial, sans-serif; fill: #111; }
    .year { font: bold 27px Arial, sans-serif; fill: #111; }
    .label { font: bold 27px Arial, sans-serif; fill: #111; }
    .value { font: 27px Arial, sans-serif; fill: #111; }
    .line { fill: none; stroke: #333; stroke-width: 1.5; }
  </style>
  <text class="heading" x="750" y="58" text-anchor="middle">Growth of global freight by 2050 and projected carbon emissions</text>
  <rect x="50" y="90" width="1400" height="435" fill="#f2f2f2"/>
  <rect x="50" y="90" width="1400" height="105" fill="#d9d9d9"/>
  <path class="line" d="M50 90H1450V525H50Z M50 195H1450 M50 250H1450 M50 305H1450 M50 360H1450 M50 415H1450 M50 470H1450 M210 90V525 M630 90V525 M790 90V525 M1210 90V525 M420 195V525 M1000 195V525"/>
